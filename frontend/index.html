<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Installable: "Add to Home Screen" opens full-screen like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ShopTogether" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before the first paint, so there's no flash.
      try {
        var t = localStorage.getItem("shoptogether.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      // Same for language: Hebrew pages start right-to-left (see src/i18n/i18n.js).
      try {
        var l = localStorage.getItem("shoptogether.language");
        var langs = navigator.languages || [navigator.language];
        var he = l === "he" || (l !== "en" && langs.some(function (x) { return /^(he|iw)\b/i.test(x || ""); }));
        document.documentElement.lang = he ? "he" : "en";
        document.documentElement.dir = he ? "rtl" : "ltr";
      } catch (e) {}
    </script>
    <title>ShopTogether</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Rubik covers Latin and Hebrew -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
